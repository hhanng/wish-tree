  <canvas id="snow" aria-hidden="true"></canvas>

  <header class="topbar">
    <a class="brand" id="home-link" href="./">Wish Tree</a>  </header>

  <main>
    <p id="loading" class="status" role="status" data-i18n="loading"></p>

    <section id="view-message" class="panel center" aria-labelledby="message-title" hidden>
      <h1 id="message-title"></h1>
      <p id="message-body"></p>
      <div class="actions">
        <button type="button" class="btn btn-primary" id="message-retry" data-i18n="retry" hidden></button>
        <a class="btn btn-glass" href="?view=me" data-i18n="make_own"></a>
      </div>
    </section>

    <section id="view-tree" aria-labelledby="owner-name" hidden>
      <div class="tree-head">
        <p class="kicker" data-i18n="kicker"></p>
        <h1 id="owner-name"></h1>
        <p class="explain" id="explain"></p>
      </div>

      <nav id="tabs" class="tabs" data-i18n-label="tabs_label" hidden></nav>

      <div class="tree-wrap">
        <svg id="tree" viewBox="40 170 740 990" role="group" data-i18n-label="tree_label">
          <g id="foliage" aria-hidden="true"></g>
          <svg x="312" y="164" width="170" height="196" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><use href="#o-bow" width="100" height="100" color="#d2273b"/></svg>
          <g id="ornaments"></g>
        </svg>
      </div>

      <p class="count" id="count" role="status"></p>

      <div class="countdown" id="countdown" role="timer" data-i18n-label="countdown_label">
        <div><b id="cd-d">0</b><span data-i18n="days"></span></div>
        <div><b id="cd-h">00</b><span data-i18n="hours"></span></div>
        <div><b id="cd-m">00</b><span data-i18n="minutes"></span></div>
        <div><b id="cd-s">00</b><span data-i18n="seconds"></span></div>
      </div>
      <p class="opens" id="opens" hidden></p>

      <div class="actions">
        <button type="button" class="btn btn-primary" id="wish-btn" data-i18n="send_wish"></button>
        <button type="button" class="btn btn-glass" id="copy-btn" data-i18n="copy_link"></button>
        <a class="btn btn-quiet" id="make-link" href="?view=me" data-i18n="make_own"></a>
      </div>

      <p class="status" id="cards-status" role="status" hidden></p>
      <ol id="cards" class="cards" data-i18n-label="cards_label" hidden></ol>
    </section>

    <section id="view-signin" class="panel" aria-labelledby="signin-title" hidden>
      <h1 id="signin-title" data-i18n="signin_title"></h1>
      <form id="email-form" novalidate hidden>
        <label for="email" data-i18n="email"></label>
        <input id="email" type="email" autocomplete="email" required>
        <button class="btn btn-primary" type="submit" data-i18n="send_link"></button>
      </form>
      <div id="email-sent" role="status" hidden>
        <h2 data-i18n="check_email"></h2>
        <p id="email-sent-body"></p>
      </div>

      <button type="button" class="btn btn-glass" id="google-btn" data-i18n="google" hidden></button>

      <div id="phone-block" hidden>
        <form id="phone-form" novalidate>
          <label for="phone" data-i18n="phone"></label>
          <input id="phone" type="tel" autocomplete="tel" placeholder="+84901234567" required>
          <button class="btn btn-glass" type="submit" data-i18n="send_code"></button>
        </form>
        <form id="otp-form" novalidate hidden>
          <label for="otp" data-i18n="code"></label>
          <input id="otp" inputmode="numeric" autocomplete="one-time-code" required>
          <button class="btn btn-primary" type="submit" data-i18n="verify_code"></button>
        </form>
      </div>

      <p class="error" id="signin-error" role="alert" hidden></p>
      <a class="back" id="back-link" href="./" data-i18n="back"></a>
    </section>

    <section id="view-me" class="panel" aria-labelledby="me-title" hidden>
      <h1 id="me-title" data-i18n="me_title"></h1>

      <form id="create-form" novalidate hidden>
        <label for="f-name" data-i18n="f_name"></label>
        <input id="f-name" maxlength="60" autocomplete="name" required>
        <label for="f-slug" data-i18n="f_slug"></label>
        <input id="f-slug" maxlength="40" autocapitalize="none" autocorrect="off" spellcheck="false" aria-describedby="slug-preview" required>
        <p class="hint" id="slug-preview"></p>
        <label for="f-date" data-i18n="f_date"></label>
        <input id="f-date" type="date" required>
        <p class="error" id="create-error" role="alert" hidden></p>
        <button class="btn btn-primary" type="submit" id="create-btn" data-i18n="create"></button>
      </form>

      <div id="my-tree" hidden>
        <label for="share-url" data-i18n="your_link"></label>
        <input id="share-url" readonly>
        <div class="actions">
          <button type="button" class="btn btn-primary" id="share-copy" data-i18n="copy_link"></button>
          <a class="btn btn-glass" id="share-open" data-i18n="open_tree"></a>
        </div>
        <dl class="stats">
          <div><dt data-i18n="stat_wishes"></dt><dd id="stat-count">–</dd></div>
          <div><dt data-i18n="stat_date"></dt><dd id="stat-date"></dd></div>
        </dl>
      </div>

      <p class="error" id="me-error" role="alert" hidden></p>
      <button type="button" class="btn btn-quiet" id="signout-btn" data-i18n="sign_out"></button>
    </section>
  </main>

  <dialog id="wish-dialog" aria-labelledby="wish-title">
    <div class="sheet">
      <button type="button" class="close" id="wish-close" data-i18n-label="close">&times;</button>
      <form id="wish-form" novalidate>
        <h2 id="wish-title" data-i18n="send_wish"></h2>
        <label for="w-name" data-i18n="w_name"></label>
        <input id="w-name" maxlength="60" autocomplete="name" data-i18n-ph="w_name_ph">
        <label for="w-message" data-i18n="w_message"></label>
        <textarea id="w-message" maxlength="600" rows="4" required data-i18n-ph="w_message_ph" aria-describedby="w-count"></textarea>
        <p class="hint counter" id="w-count">0 / 600</p>
        <p class="legend" id="picker-label" data-i18n="w_ornament"></p>
        <div class="picker" id="picker" role="radiogroup" aria-labelledby="picker-label"></div>
        <p class="error" id="wish-error" role="alert" hidden></p>
        <button class="btn btn-primary wide" type="submit" id="wish-submit" data-i18n="hang"></button>
      </form>
      <div id="wish-done" class="center" hidden>
        <svg class="done-orn" viewBox="0 0 100 100" aria-hidden="true"><use id="done-use" href="#o-bow" width="100" height="100" color="#b52824"/></svg>
        <h2 data-i18n="done_title" tabindex="-1" id="done-title"></h2>
        <p id="done-body"></p>
        <button type="button" class="btn btn-primary" id="done-close" data-i18n="done_close"></button>
      </div>
    </div>
  </dialog>

  <footer class="legal">
    <a href="privacy.html">Privacy</a>
    <a href="terms.html">Terms</a>
  </footer>

  <noscript><p class="status">Wish Tree needs JavaScript.</p></noscript>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/config.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
